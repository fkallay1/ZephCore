# KISS modem role: raw LoRa packets to a host over a serial port (upstream
# MeshCore examples/kiss_modem, protocol in docs/kiss_modem_protocol.md).
#
# Build with: -DEXTRA_CONF_FILE="boards/common/kiss_modem.conf"
#
# The host port is the chosen `zephcore,kiss-uart` node if the devicetree names
# one (upstream's KISS_UART_RX/TX), else the USB CDC-ACM port, else the console.

CONFIG_ZEPHCORE_ROLE_KISS_MODEM=y

# No BLE; entropy explicitly, as BT no longer pulls it in.
CONFIG_BT=n
CONFIG_ENTROPY_GENERATOR=y

# The port carries the binary KISS stream: the console driver must not also
# write to it, or boot and printk bytes land in the stream. With a
# `zephcore,kiss-uart` other than the console, a build may turn the console back
# on (-DCONFIG_UART_CONSOLE=y, plus debug.conf for logs); src/main_kiss_modem.cpp
# fails the build if the console is the KISS port.
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
