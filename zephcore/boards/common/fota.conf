# LoRa-FOTA delta patch receiver (nRF52840 repeater)
# Usage:
#   west build -b promicro_sx1262 zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/fota.conf"
CONFIG_ZEPHCORE_LORA_FOTA=y

# malloc arena: patch buffer (~40kB max) + scratch — the RAM-flasher path needs
# the patch below 0x20020000, which a low heap naturally satisfies
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
